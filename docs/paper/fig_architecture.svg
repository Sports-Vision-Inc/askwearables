<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d3c39"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a8a63"/>
    </marker>
    <style>
      .zone { fill: #f4f3ef; stroke: #d9d8d2; stroke-width: 1; }
      .zlabel { font-size: 11px; fill: #6b6a64; letter-spacing: .06em; font-weight: 600; }
      .box { fill: #ffffff; stroke: #3d3c39; stroke-width: 1.2; rx: 8; }
      .boxk { fill: #eef5ff; stroke: #2a78d6; stroke-width: 1.4; rx: 8; }
      .boxp { fill: #ecf8f2; stroke: #1a8a63; stroke-width: 1.4; rx: 8; }
      .t { font-size: 13px; font-weight: 700; fill: #0b0b0b; }
      .s { font-size: 11px; fill: #52514e; }
      .flow { stroke: #3d3c39; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
      .ret { stroke: #1a8a63; stroke-width: 1.6; fill: none; marker-end: url(#arrg); }
      .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .dash { stroke: #9b9a94; stroke-dasharray: 4 3; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <!-- trust zones -->
  <rect class="zone" x="10" y="40" width="150" height="380" rx="10"/>
  <text class="zlabel" x="22" y="60">AGENT</text>
  <rect class="zone" x="175" y="40" width="250" height="380" rx="10"/>
  <text class="zlabel" x="187" y="60">REQUEST PATH (no data, no policy)</text>
  <rect class="zone" x="440" y="40" width="510" height="380" rx="10"/>
  <text class="zlabel" x="452" y="60">PROTECTED (no public route)</text>

  <!-- agent -->
  <rect class="box" x="25" y="170" width="120" height="70"/>
  <text class="t" x="85" y="198" text-anchor="middle">Any AI agent</text>
  <text class="s" x="85" y="216" text-anchor="middle">MCP · REST · A2A</text>
  <text class="s" x="85" y="231" text-anchor="middle">ask(question)</text>

  <!-- edge -->
  <rect class="box" x="190" y="90" width="220" height="62"/>
  <text class="t" x="300" y="115" text-anchor="middle">Edge adapter</text>
  <text class="s" x="300" y="133" text-anchor="middle">OAuth 2.1 resource server</text>
  <text class="s" x="300" y="146" text-anchor="middle">token audience-bound to one grant</text>

  <!-- planner -->
  <rect class="boxk" x="190" y="190" width="220" height="92"/>
  <text class="t" x="300" y="214" text-anchor="middle">LLM planner</text>
  <text class="s" x="300" y="232" text-anchor="middle">sees question + metric catalog only</text>
  <text class="s" x="300" y="247" text-anchor="middle">emits a typed QuerySpec or refuses</text>
  <text class="s" x="300" y="262" text-anchor="middle">output validated against a schema</text>
  <text class="s" x="300" y="276" text-anchor="middle" fill="#2a78d6">never sees the stored record</text>

  <!-- gate -->
  <rect class="box" x="460" y="90" width="210" height="140"/>
  <text class="t" x="565" y="114" text-anchor="middle">Policy gate</text>
  <text class="s" x="475" y="134">1 token, grant, expiry</text>
  <text class="s" x="475" y="149">2 metrics in grant</text>
  <text class="s" x="475" y="164">3 provider terms (no-AI)</text>
  <text class="s" x="475" y="179">4 sensitive categories</text>
  <text class="s" x="475" y="194">5 clamp window  6 release level</text>
  <text class="s" x="475" y="209">7 daily limit  8 purpose check</text>
  <text class="s" x="475" y="224">deterministic code, deny by default</text>

  <!-- vault -->
  <rect class="box" x="690" y="90" width="245" height="235"/>
  <text class="t" x="812" y="114" text-anchor="middle">Per-user vault</text>
  <rect class="boxp" x="705" y="126" width="215" height="44"/>
  <text class="t" x="812" y="145" text-anchor="middle" font-size="12">Compute engine</text>
  <text class="s" x="812" y="161" text-anchor="middle">8 fixed operations, tested code</text>
  <rect class="box" x="705" y="178" width="215" height="44"/>
  <text class="t" x="812" y="197" text-anchor="middle" font-size="12">Metric store</text>
  <text class="s" x="812" y="213" text-anchor="middle">per-source rollups · baselines</text>
  <rect class="boxp" x="705" y="230" width="215" height="44"/>
  <text class="t" x="812" y="249" text-anchor="middle" font-size="12">Packet builder</text>
  <text class="s" x="812" y="265" text-anchor="middle">coarsen to level · caveats · ≤400 tokens</text>
  <rect class="box" x="705" y="282" width="215" height="36"/>
  <text class="t" x="812" y="304" text-anchor="middle" font-size="12">Hash-chained receipt</text>

  <!-- ingestion -->
  <rect class="box" x="460" y="300" width="210" height="62"/>
  <text class="t" x="565" y="324" text-anchor="middle">Ingestion</text>
  <text class="s" x="565" y="341" text-anchor="middle">phone stores · vendor APIs · files</text>
  <text class="s" x="565" y="355" text-anchor="middle">normalize, dedupe, local day</text>
  <path class="flow" d="M670,331 L700,318"/>

  <!-- flow -->
  <path class="flow" d="M145,190 C165,150 170,121 190,121"/>
  <path class="flow" d="M300,152 L300,188"/>
  <path class="flow" d="M410,236 C440,236 430,175 458,175"/>
  <path class="flow" d="M670,148 L703,148"/>
  <path class="ret" d="M812,320 L812,388 Q812,398 802,398 L95,398 Q85,398 85,388 L85,244"/>

  <!-- step numbers -->
  <circle cx="162" cy="140" r="9" fill="#3d3c39"/><text class="num" x="162" y="144" text-anchor="middle">1</text>
  <circle cx="318" cy="170" r="9" fill="#3d3c39"/><text class="num" x="318" y="174" text-anchor="middle">2</text>
  <circle cx="432" cy="205" r="9" fill="#3d3c39"/><text class="num" x="432" y="209" text-anchor="middle">3</text>
  <circle cx="686" cy="132" r="9" fill="#3d3c39"/><text class="num" x="686" y="136" text-anchor="middle">4</text>
  <circle cx="300" cy="398" r="9" fill="#1a8a63"/><text class="num" x="300" y="402" text-anchor="middle">5</text>

  <text class="s" x="190" y="352" fill="#1a8a63">context packet: values or buckets at the</text><text class="s" x="190" y="367" fill="#1a8a63">granted level, personal baseline, freshness,</text><text class="s" x="190" y="382" fill="#1a8a63">data-quality caveats, receipt id</text>

  <!-- caption-like legend -->
  <text class="s" x="10" y="455">1 the agent asks · 2 the planner turns the question into a QuerySpec · 3 the gate checks it against the user's grant and picks the coarsest level · 4 only the vault reads data · 5 a packet returns.</text>
  <text class="t" x="10" y="25">AskWearables: a broker between wearable data and AI agents</text>
</svg>
