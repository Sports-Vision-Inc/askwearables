# Generate the Xcode project with: xcodegen generate (run from mobile/ios)
name: AskWearablesSync
options:
  bundleIdPrefix: app.askwearables
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AskWearablesKit:
    path: AskWearablesKit
targets:
  AskWearablesSync:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: AskWearablesKit
      - sdk: HealthKit.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AskWearables Sync
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: "AskWearables Sync reads the health data types you choose (steps, energy, heart rate, HRV, blood oxygen, breathing rate, VO2 max, weight, sleep, workouts and sleeping wrist temperature) and sends them to your AskWearables account, where you decide which apps and agents may ask about them."
        NSHealthUpdateUsageDescription: "AskWearables Sync does not write to Apple Health."
        UIRequiredDeviceCapabilities: [healthkit]
    entitlements:
      path: App/AskWearablesSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.askwearables.sync
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # Set your own team for on-device runs (see docs/mobile.md). Left empty on purpose.
        DEVELOPMENT_TEAM: ""
schemes:
  AskWearablesSync:
    build:
      targets:
        AskWearablesSync: all
    test:
      targets:
        - package: AskWearablesKit/AskWearablesKitTests
